<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>People Table</title>
    <link rel="stylesheet" href="data.css">
</head>

<body>
    <div class="box">
        <h1>People</h1>
        <input type="text" id="search" placeholder="Search by name, age or city...">
        <button id="sortName">Sort by name</button>
        <button id="sortAge">Sort by age</button>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script src="data.js"></script>
</body>

</html>
